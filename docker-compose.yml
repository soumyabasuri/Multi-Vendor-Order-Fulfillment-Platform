version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mvp_postgres
    environment:
      POSTGRES_DB: multivendor_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d multivendor_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mvp_network

  redis:
    image: redis:7-alpine
    container_name: mvp_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - mvp_network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: mvp_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - mvp_network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: mvp_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - mvp_network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: mvp_kafka_ui
    depends_on:
      - kafka
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - mvp_network

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: mvp_api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=multivendor_db;Username=postgres;Password=postgrespassword
      Redis__ConnectionString: redis:6379
      Kafka__BootstrapServers: kafka:29092
      Jwt__Secret: A_Very_Strong_And_Ultra_Secure_Production_Grade_Secret_Key_At_Least_32_Bytes_Long!
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mvp_network

  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
    container_name: mvp_frontend
    depends_on:
      - api
    ports:
      - "4200:80"
    networks:
      - mvp_network

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: mvp_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - mvp_network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: mvp_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - mvp_network

volumes:
  postgres_data:
  redis_data:

networks:
  mvp_network:
    driver: bridge
